plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
    id "com.peterabeles.gversion" version "1.10"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    maven {
        url = uri("https://3015rangerrobotics.github.io/pathplannerlib/repo")
    }
}

sourceSets {
    main {
        java {
            // Surface AutoLog-generated sources to IDEs and incremental compilers.
            srcDir "$buildDir/generated/sources/annotationProcessor/java/main"
        }
    }
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

project.compileJava.dependsOn(createVersionFile)
gversion {
  srcDir       = "src/main/java/"
  classPackage = "frc.robot"
  className    = "BuildConstants"
  dateFormat   = "yyyy-MM-dd HH:mm:ss z"
  timeZone     = "America/New_York" // Use preferred time zone
  indent       = "  "
}

// Create commit with working changes on event branches
// https://docs.advantagekit.org/getting-started/installation/version-control
task(eventDeploy) {
    doLast {
        if (project.gradle.startParameter.taskNames.any({ it.toLowerCase().contains("deploy") })) {
            def branchPrefix = "event"
            def branch = 'git branch --show-current'.execute().text.trim()
            def commitMessage = "Update at '${new Date().toString()}'"

            if (branch.startsWith(branchPrefix)) {
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'add', '-A'
                }
                exec {
                    workingDir(projectDir)
                    executable 'git'
                    args 'commit', '-m', commitMessage
                    ignoreExitValue = true
                }

                println "Committed to branch: '$branch'"
                println "Commit message: '$commitMessage'"
            } else {
                println "Not on an event branch, skipping commit"
            }
        } else {
            println "Not running deploy task, skipping commit"
        }
    }
}
createVersionFile.dependsOn(eventDeploy)

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = true // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

task(replayWatch, type: JavaExec) {
    mainClass = "org.littletonrobotics.junction.ReplayWatch"
    classpath = sourceSets.main.runtimeClasspath
}

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()
    implementation "com.pathplanner.lib:PathplannerLib-java:2026.1.2"

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    def akitJson = new groovy.json.JsonSlurper().parseText(new File(projectDir.getAbsolutePath() + "/vendordeps/AdvantageKit.json").text)
    annotationProcessor "org.littletonrobotics.akit:akit-autolog:$akitJson.version"
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def markdownInputDir = file("src/main/java")
def markdownOutputDir = file("$buildDir/generated/readme-html")

tasks.register("renderMarkdown") {
    description = "Render Markdown files to HTML for Javadoc output."
    group = "documentation"
    inputs.files(fileTree(markdownInputDir) { include "**/*.md" })
    inputs.files(fileTree(".") { include "*.md"; exclude "*License*" })
    outputs.dir(markdownOutputDir)

    doLast {
        def markdownFiles = fileTree(markdownInputDir) { include "**/*.md" }.files
        def rootMarkdownFiles = fileTree(".") { include "*.md"; exclude "*License*" }.files
        def allMarkdownFiles = []
        allMarkdownFiles.addAll(markdownFiles)
        allMarkdownFiles.addAll(rootMarkdownFiles)
        if (allMarkdownFiles.isEmpty()) {
            return
        }

        def toDisplayName = { mdPath ->
            // Root-level files: README.md -> "Project README", GLOSSARY.md -> "Project Glossary"
            if (!mdPath.contains("/")) {
                def baseName = mdPath.replaceAll(/\.md$/, "")
                def pretty = baseName.substring(0, 1).toUpperCase() + baseName.substring(1).toLowerCase()
                return "Project ${pretty}"
            }
            // Subsystem files: frc/robot/subsystems/<name>/<file>.md
            def subsystemMatch = (mdPath =~ /frc\/robot\/subsystems\/([^\\/]+)\/([^\\/]+)\.md/)
            if (subsystemMatch.matches()) {
                def subsystemName = subsystemMatch[0][1]
                def fileName = subsystemMatch[0][2]
                def prettySubsystem = subsystemName.substring(0, 1).toUpperCase() + subsystemName.substring(1)
                def prettyFile = fileName.substring(0, 1).toUpperCase() + fileName.substring(1).toLowerCase()
                return "${prettySubsystem} Subsystem ${prettyFile}"
            }
            // Subsystems index: frc/robot/subsystems/<file>.md
            def subsystemsIndexMatch = (mdPath =~ /frc\/robot\/subsystems\/([^\\/]+)\.md/)
            if (subsystemsIndexMatch.matches()) {
                def fileName = subsystemsIndexMatch[0][1]
                def prettyFile = fileName.substring(0, 1).toUpperCase() + fileName.substring(1).toLowerCase()
                return "Subsystems ${prettyFile}"
            }
            // Shared files: frc/robot/shared/**/<file>.md
            def sharedMatch = (mdPath =~ /frc\/robot\/shared\/.*?([^\\/]+)\.md/)
            if (sharedMatch.matches()) {
                def fileName = sharedMatch[0][1]
                def prettyFile = fileName.substring(0, 1).toUpperCase() + fileName.substring(1).toLowerCase()
                return "Shared ${prettyFile}"
            }
            // Other files under frc/robot: frc/robot/<file>.md
            def robotMatch = (mdPath =~ /frc\/robot\/([^\\/]+)\.md/)
            if (robotMatch.matches()) {
                def fileName = robotMatch[0][1]
                def prettyFile = fileName.substring(0, 1).toUpperCase() + fileName.substring(1).toLowerCase()
                return "Project ${prettyFile}"
            }
            // Fallback: strip .md, replace path separators, title-case
            def cleaned = mdPath.replaceAll(/\.md$/, "").replaceAll("/", " ")
            return cleaned.replaceAll("\\s+", " ").trim()
        }

        markdownOutputDir.mkdirs()
        allMarkdownFiles.each { mdFile ->
            def isRootFile = rootMarkdownFiles.contains(mdFile)
            def relativePath = isRootFile
                ? mdFile.name
                : markdownInputDir.toPath().relativize(mdFile.toPath()).toString()
            def outputFile = new File(markdownOutputDir, relativePath.replaceAll(/\.md$/, ".html"))
            outputFile.parentFile.mkdirs()

            def markedOutput = new ByteArrayOutputStream()
            exec {
                executable "npx"
                args "--yes", "marked", mdFile.absolutePath
                standardOutput = markedOutput
            }

            def relativeSegments = relativePath.replaceAll(/\.md$/, ".html").tokenize("/")
            def depth = Math.max(relativeSegments.size() - 1, 0)
            def rootPrefix = depth == 0 ? "" : "../" * depth
            def stylesheetPath = "${rootPrefix}stylesheet.css"
            def scriptPath = "${rootPrefix}script.js"
            def jqueryPath = "${rootPrefix}script-dir/jquery-3.7.1.min.js"
            def jqueryUiPath = "${rootPrefix}script-dir/jquery-ui.min.js"
            def jqueryUiCssPath = "${rootPrefix}script-dir/jquery-ui.min.css"
            def jqueryUiOverridesPath = "${rootPrefix}jquery-ui.overrides.css"
            def indexPath = "${rootPrefix}index.html"
            def pageTitle = toDisplayName(relativePath)

            outputFile.text = """
<!DOCTYPE HTML>
<html lang=\"en\">
<head>
    <!-- Generated by javadoc (17) -->
    <title>${pageTitle} (2026-frc-rebuilt API)</title>
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">
    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">
    <meta name=\"description\" content=\"documentation\">
    <meta name=\"generator\" content=\"javadoc/PackageIndexWriter\">
    <link rel=\"stylesheet\" type=\"text/css\" href=\"${stylesheetPath}\" title=\"Style\">
    <link rel=\"stylesheet\" type=\"text/css\" href=\"${jqueryUiCssPath}\" title=\"Style\">
    <link rel=\"stylesheet\" type=\"text/css\" href=\"${jqueryUiOverridesPath}\" title=\"Style\">
    <script type=\"text/javascript\" src=\"${scriptPath}\"></script>
    <script type=\"text/javascript\" src=\"${jqueryPath}\"></script>
    <script type=\"text/javascript\" src=\"${jqueryUiPath}\"></script>
    <style>
        .readme-nav { margin: 1rem 0 2rem 0; }
        .readme-nav a { margin-right: 1rem; }
    </style>
</head>
<body class=\"package-index-page\">
<script type=\"text/javascript\">var pathtoroot = \"${rootPrefix}\"; loadScripts(document, 'script');</script>
<noscript>
<div>JavaScript is disabled on your browser.</div>
</noscript>
<div class=\"flex-box\">
<header role=\"banner\" class=\"flex-header\">
<nav role=\"navigation\">
<!-- ========= START OF TOP NAVBAR ======= -->
<div class=\"top-nav\" id=\"navbar-top\">
<div class=\"skip-nav\"><a href=\"#skip-navbar-top\" title=\"Skip navigation links\">Skip navigation links</a></div>
<ul id=\"navbar-top-firstrow\" class=\"nav-list\" title=\"Navigation\">
<li class=\"nav-bar-cell1-rev\">Overview</li>
<li>Package</li>
<li>Class</li>
<li><a href=\"${rootPrefix}overview-tree.html\">Tree</a></li>
<li><a href=\"${rootPrefix}index-all.html\">Index</a></li>
<li><a href=\"${rootPrefix}help-doc.html#overview\">Help</a></li>
</ul>
</div>
<div class=\"sub-nav\">
<div class=\"nav-list-search\"><label for=\"search-input\">SEARCH:</label>
<input type=\"text\" id=\"search-input\" value=\"search\" disabled=\"disabled\">
<input type=\"reset\" id=\"reset-button\" value=\"reset\" disabled=\"disabled\">
</div>
</div>
<!-- ========= END OF TOP NAVBAR ========= -->
<span class=\"skip-nav\" id=\"skip-navbar-top\"></span></nav>
</header>
<div class=\"flex-content\">
<main role=\"main\">
<div class=\"header\">
<h1 class=\"title\">${pageTitle}</h1>
</div>
<div class=\"contentContainer\">
<div class=\"description\">
<nav class=\"readme-nav\">
<a href=\"${indexPath}\">Overview</a>
<a href=\"${rootPrefix}README.html\">Project README</a>
<a href=\"${rootPrefix}frc/robot/GLOSSARY.html\">Glossary</a>
</nav>
${markedOutput.toString("UTF-8")}
</div>
</div>
</main>
</div>
</div>
</body>
</html>
"""
        }

        def overviewFile = new File(markdownOutputDir, "overview.html")
        def overviewLinks = allMarkdownFiles.collect { mdFile ->
            def isRootFile = rootMarkdownFiles.contains(mdFile)
            def relativePath = isRootFile
                ? mdFile.name
                : markdownInputDir.toPath().relativize(mdFile.toPath()).toString()
            def htmlPath = relativePath.replaceAll(/\.md$/, ".html")
            def displayName = toDisplayName(relativePath)
            return [path: htmlPath, name: displayName]
        }.sort { a, b ->
            // Project README first, then Project-level docs, then alphabetical
            if (a.path == "README.html") return -1
            if (b.path == "README.html") return 1
            if (a.name.startsWith("Project") && !b.name.startsWith("Project")) return -1
            if (!a.name.startsWith("Project") && b.name.startsWith("Project")) return 1
            return a.name <=> b.name
        }

        overviewFile.text = """
<!DOCTYPE HTML>
<html lang=\"en\">
<head>
    <!-- Generated by javadoc (17) -->
    <title>Overview (2026-frc-rebuilt API)</title>
    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=utf-8\">
    <meta name=\"description\" content=\"package index\">
    <meta name=\"generator\" content=\"javadoc/PackageIndexWriter\">
    <link rel=\"stylesheet\" type=\"text/css\" href=\"stylesheet.css\" title=\"Style\">
</head>
<body>
<h1>Project Documentation</h1>
<p>Browse project guides, subsystem documentation, and the glossary of robotics and programming terms.</p>
<ul>
${overviewLinks.collect { "<li><a href=\"${it.path}\">${it.name}</a></li>" }.join("\n")}
</ul>
</body>
</html>
"""
    }
}

tasks.named("javadoc") {
    dependsOn tasks.named("renderMarkdown")
    options.overview = file("$markdownOutputDir/overview.html")
    exclude("**/*AutoLogged.java")
    exclude("frc/robot/BuildConstants.java")

    doLast {
        copy {
            from(markdownOutputDir)
            into(destinationDir)
        }
    }
}
